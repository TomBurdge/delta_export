#
# Full build: all platforms. Manual trigger or tag push.
# Builds at the DuckDB commit community-extensions uses for 2.0 (v2.0.0-alpha46057).
#
name: Main Extension Distribution Pipeline
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

env:
  DUCKDB_TAG: v2.0.0-alpha46057

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      duckdb_version: b15358c371daf10dad799a43b6167f6ccdce84d8
      ci_tools_version: v2.0-cyanoptera
      extension_name: delta_export

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v2.0-cyanoptera
    with:
      duckdb_version: b15358c371daf10dad799a43b6167f6ccdce84d8
      ci_tools_version: v2.0-cyanoptera
      extension_name: delta_export

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: duckdb-stable-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: delta_export-*
          path: artifacts/

      # Artifact names are generated by extension-ci-tools; the platform is the last part of the folder name
      - name: Gzip and arrange artifacts
        run: |
          find artifacts -name 'delta_export.duckdb_extension' | while read -r f; do
            dir=$(basename "$(dirname "$f")")
            platform=$(echo "$dir" | grep -oE '(linux_amd64_musl|linux_amd64|linux_arm64|osx_amd64|osx_arm64|windows_amd64_mingw|windows_amd64|wasm_mvp|wasm_eh|wasm_threads)$' || true)
            if [ -z "$platform" ]; then echo "Skipping $f (unknown platform)"; continue; fi
            mkdir -p "deploy/${DUCKDB_TAG}/${platform}"
            gzip -c "$f" > "deploy/${DUCKDB_TAG}/${platform}/delta_export.duckdb_extension.gz"
            echo "Packaged ${platform}"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
