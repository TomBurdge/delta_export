name: DuckLake filter repro
# Replays fuzz seeds with plain DuckDB + DuckLake on the local filesystem and shrinks the statements to a
# minimal script where a filtered count disagrees with a full scan (a DuckLake bug, not delta_export's).
on:
  workflow_dispatch:
    inputs:
      seeds:
        description: 'Fuzz seeds to replay'
        default: ''

permissions:
  contents: read

jobs:
  repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install duckdb==1.5.6 pytz

      - name: Minimal script (test/repro/ducklake_filter_bug.sql)
        run: python test/repro/run_filter_bug.py

      - name: Search and minimise from fuzz seeds
        if: ${{ inputs.seeds != '' }}
        run: python test/repro/ducklake_filter_repro.py ${{ inputs.seeds }}
