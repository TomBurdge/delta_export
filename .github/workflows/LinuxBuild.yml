name: Linux Build
on:
  push:
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'Makefile'
      - 'extension_config.cmake'
      - 'duckdb'
      - 'extension-ci-tools'
  pull_request:
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'Makefile'
      - 'extension_config.cmake'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (linux_amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # DuckDB itself is most of the build; ccache keeps its objects between runs so a change to the
      # extension only recompiles the extension
      - run: sudo apt-get update && sudo apt-get install -y ninja-build

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-amd64-duckdb-v1.5.6
          max-size: 2G

      - name: Build extension
        run: make release
        env:
          GEN: ninja
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache

      - uses: actions/upload-artifact@v4
        with:
          name: delta_export-linux_amd64
          path: build/release/extension/delta_export/delta_export.duckdb_extension
