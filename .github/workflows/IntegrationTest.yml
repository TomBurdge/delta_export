name: Integration Test
on:
  workflow_run:
    workflows: ["Linux Build"]
    types: [completed]
    branches: [main]
  push:
    paths:
      - 'test/python/**'
  workflow_dispatch:
    inputs:
      fuzz_seeds:
        description: 'Number of fuzz seeds (0..n-1)'
        default: '30'
      fuzz_seed:
        description: 'Replay a single fuzz seed (overrides fuzz_seeds)'
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  python-tests:
    name: Python tests
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download extension artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          name: delta_export-linux_amd64
          run_id: ${{ github.event.workflow_run.id }}
          path: ./artifact
          search_artifacts: true
          if_no_artifact_found: warn

      - name: Fallback - download latest artifact
        if: ${{ hashFiles('artifact/delta_export.duckdb_extension') == '' }}
        uses: dawidd6/action-download-artifact@v6
        with:
          name: delta_export-linux_amd64
          workflow: LinuxBuild.yml
          path: ./artifact
          search_artifacts: true

      - run: pip install duckdb==1.5.5 deltalake pyarrow pytest

      # delta_scan (delta-kernel-rs) and delta-rs read every export; Spark runs in its own job
      - run: pytest test/python/ -v -s --tb=long -m "not spark"
        env:
          DELTA_EXPORT_EXTENSION_PATH: ./artifact/delta_export.duckdb_extension

  spark-tests:
    name: Spark (Fabric Runtime 2.0)
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # Fabric Runtime 2.0: Spark 4.1, Delta Lake 4.2, Java 21, Python 3.13
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Download extension artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          name: delta_export-linux_amd64
          run_id: ${{ github.event.workflow_run.id }}
          path: ./artifact
          search_artifacts: true
          if_no_artifact_found: warn

      - name: Fallback - download latest artifact
        if: ${{ hashFiles('artifact/delta_export.duckdb_extension') == '' }}
        uses: dawidd6/action-download-artifact@v6
        with:
          name: delta_export-linux_amd64
          workflow: LinuxBuild.yml
          path: ./artifact
          search_artifacts: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # delta-spark 4.2.0 pins pyspark <= 4.1.1
      - run: pip install duckdb==1.5.5 pyspark==4.1.1 delta-spark==4.2.0 pyarrow pytest

      # Spark + Delta Lake is the reference reader: smoke suite, edge cases, randomized workloads
      - run: pytest test/python/ -v -s --tb=long -m spark
        env:
          DELTA_EXPORT_EXTENSION_PATH: ./artifact/delta_export.duckdb_extension
          FUZZ_SEEDS: ${{ inputs.fuzz_seeds || '30' }}
          FUZZ_SEED: ${{ inputs.fuzz_seed }}

  onelake-tests:
    # Live OneLake round trip. Auth is GitHub OIDC only: the test exchanges the job's id-token for a
    # storage token (workload-identity federation, no client secret, no az login). Runs last: the final
    # check is the Fabric SQL analytics endpoint reading the exported tables.
    name: OneLake + SQL endpoint
    needs: spark-tests
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ONELAKE_WAREHOUSE: 1c52481c-0523-4a5a-bbde-fdc932bd77c2/7cb28f47-65bd-4aac-96c0-f7dd4eeb40ff
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download extension artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          name: delta_export-linux_amd64
          run_id: ${{ github.event.workflow_run.id }}
          path: ./artifact
          search_artifacts: true
          if_no_artifact_found: warn

      - name: Fallback - download latest artifact
        if: ${{ hashFiles('artifact/delta_export.duckdb_extension') == '' }}
        uses: dawidd6/action-download-artifact@v6
        with:
          name: delta_export-linux_amd64
          workflow: LinuxBuild.yml
          path: ./artifact
          search_artifacts: true

      - run: pip install duckdb==1.5.5 azure-identity mssql-python pytest

      - run: pytest test/python/test_onelake.py -v -s --tb=long
        env:
          DELTA_EXPORT_EXTENSION_PATH: ./artifact/delta_export.duckdb_extension
