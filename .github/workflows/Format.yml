name: Format
# Runs the same formatters as the distribution pipeline's Format Check (make format-fix: clang-format 11, black 24,
# cmake-format) and commits the result to the branch it runs on.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - run: |
          sudo apt-get update -y -qq && sudo apt-get install -y -qq clang-format-11
          sudo pip3 install cmake-format 'black==24.*' cxxheaderparser pcpp 'clang_format==11.0.1'

      - run: make format-fix

      - run: make format-check

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -m "Apply clang-format and black"; git push; }
