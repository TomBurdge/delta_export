name: Format
# Applies the same formatters as the distribution pipeline's Format Check (clang-format 11, black 24)
# and commits the result to the branch it runs on.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - run: |
          sudo apt-get update -y -qq && sudo apt-get install -y -qq clang-format-11
          sudo pip3 install cmake-format 'black==24.*' cxxheaderparser pcpp 'clang_format==11.0.1'

      - run: python3 duckdb/scripts/format.py --all --fix --noconfirm --directories src test

      - run: python3 duckdb/scripts/format.py --all --check --directories src test

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src test
          git diff --cached --quiet || { git commit -m "Apply clang-format and black"; git push; }
